<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tender Document Package Builder — Assemble, validate, and generate PDF tender submission packages entirely in your browser.">
  <title>Tender Document Package Builder</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- pdf.js for reading/validating PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- pdf-lib for creating/merging PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
  <!-- ═══════════════════════════════════════════════ -->
  <!-- TOP BAR: App title + Language Switcher          -->
  <!-- ═══════════════════════════════════════════════ -->
  <header id="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-icon">📦</span>
        <h1 id="app-title">Tender Document Package Builder</h1>
      </div>
      <div class="header-actions">
        <div id="language-switcher" class="lang-switcher">
          <button id="btn-lang-en" class="lang-btn active" data-lang="en">EN</button>
          <button id="btn-lang-bn" class="lang-btn" data-lang="bn">বাং</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- MAIN CONTENT                                    -->
  <!-- ═══════════════════════════════════════════════ -->
  <main id="app-main">

    <!-- ─── Step 1: Load Requirements ─── -->
    <section id="section-load" class="app-section glass-panel">
      <div class="section-header">
        <span class="section-number">1</span>
        <h2 id="section-load-title">Load Requirements</h2>
      </div>
      <div id="load-content" class="section-body">
        <div id="json-upload-zone" class="upload-zone">
          <label for="json-file-input" class="upload-label">
            <span class="upload-icon">📄</span>
            <span id="json-upload-text" class="upload-text">Choose requirements.json or drag & drop</span>
            <input type="file" id="json-file-input" accept=".json,application/json" hidden>
          </label>
        </div>
      </div>
    </section>

    <!-- ─── Tender Info Panel ─── -->
    <section id="section-tender-info" class="app-section glass-panel">
      <div class="section-header">
        <span class="section-icon">🏢</span>
        <h2 id="section-tender-title">Tender Information</h2>
      </div>
      <div id="tender-info-content" class="section-body">
        <!-- Populated by js/ui/tenderInfo.js -->
      </div>
    </section>

    <!-- ─── Step 2: Upload PDF Files ─── -->
    <section id="section-upload" class="app-section glass-panel">
      <div class="section-header">
        <span class="section-number">2</span>
        <h2 id="section-upload-title">Upload PDF Files</h2>
      </div>
      <div id="upload-content" class="section-body">
        <div id="pdf-upload-zone" class="upload-zone">
          <label for="pdf-file-input" class="upload-label">
            <span class="upload-icon">📎</span>
            <span id="pdf-upload-text" class="upload-text">Choose PDF files or drag & drop (max 30 files, 50 MB)</span>
            <input type="file" id="pdf-file-input" accept=".pdf,application/pdf" multiple hidden>
          </label>
        </div>
        <div id="file-list-container">
          <!-- Populated by js/ui/fileUpload.js -->
        </div>
      </div>
    </section>

    <!-- ─── Step 3: Requirements & Matching ─── -->
    <section id="section-requirements" class="app-section glass-panel">
      <div class="section-header">
        <span class="section-number">3</span>
        <h2 id="section-requirements-title">Document Requirements & Matching</h2>
      </div>
      <div id="requirements-content" class="section-body">
        <!-- Populated by js/ui/requirementsList.js + js/ui/matchingUI.js -->
      </div>
    </section>

    <!-- ─── Step 4: Generate & Download ─── -->
    <section id="section-generate" class="app-section glass-panel">
      <div class="section-header">
        <span class="section-number">4</span>
        <h2 id="section-generate-title">Generate Package</h2>
      </div>
      <div id="generate-content" class="section-body">
        <div id="blocking-reasons" class="blocking-reasons">
          <!-- Populated by status engine -->
        </div>
        <div class="generate-actions">
          <button id="btn-generate" class="btn btn-primary btn-large" disabled>
            <span class="btn-icon">⚡</span>
            <span id="btn-generate-text">Generate Package</span>
          </button>
          <button id="btn-download" class="btn btn-success btn-large hidden">
            <span class="btn-icon">⬇️</span>
            <span id="btn-download-text">Download Package</span>
          </button>
        </div>
        <div id="generation-progress" class="progress-container hidden">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <span id="progress-text" class="progress-text">Generating...</span>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- NOTIFICATIONS CONTAINER                         -->
  <!-- ═══════════════════════════════════════════════ -->
  <div id="notifications-container" class="notifications-container"></div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- FOOTER                                          -->
  <!-- ═══════════════════════════════════════════════ -->
  <footer id="app-footer">
    <p id="footer-text">Tender Document Package Builder &mdash; AI DevFest 2026</p>
  </footer>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- APPLICATION SCRIPTS (ES Modules)                -->
  <!-- ═══════════════════════════════════════════════ -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
